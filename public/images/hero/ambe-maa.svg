<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Ambe Maa">
  <defs>
    <filter id="aura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FFE9A0" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F0C14A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9920A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="260" cy="250" r="230" fill="url(#halo)"/>

  <g transform="translate(260 250)" filter="url(#aura)">
    <!-- Flame / tilak -->
    <path d="M0,-198 C-10,-150 -8,-120 0,-98 C8,-120 10,-150 0,-198 Z" fill="#C41E3A"/>

    <!-- Third eye -->
    <path d="M0,-92 C-22,-92 -26,-62 -26,-50 C-26,-34 -14,-24 0,-24 C14,-24 26,-34 26,-50 C26,-62 22,-92 0,-92 Z" fill="#C41E3A"/>
    <ellipse cx="0" cy="-54" rx="15" ry="20" fill="#fff"/>
    <circle cx="0" cy="-54" r="8" fill="#111"/>

    <!-- Crescent -->
    <path d="M-32,-12 Q0,-34 32,-12 Q0,2 -32,-12 Z" fill="#fff"/>

    <!-- Bindi -->
    <circle cx="0" cy="10" r="9" fill="#C41E3A"/>

    <!-- Eyebrows -->
    <path d="M-188,28 C-132,-14 -72,2 -38,44" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <path d="M188,28 C132,-14 72,2 38,44" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>

    <!-- Left eye -->
    <path d="M-188,78 C-132,28 -68,28 -32,78 C-68,120 -132,120 -188,78 Z" fill="#5C1A1A"/>
    <path d="M-176,78 C-132,40 -78,40 -46,78 C-78,108 -132,108 -176,78 Z" fill="#fff"/>
    <circle cx="-111" cy="78" r="20" fill="#111"/>

    <!-- Right eye -->
    <path d="M188,78 C132,28 68,28 32,78 C68,120 132,120 188,78 Z" fill="#5C1A1A"/>
    <path d="M176,78 C132,40 78,40 46,78 C78,108 132,108 176,78 Z" fill="#fff"/>
    <circle cx="111" cy="78" r="20" fill="#111"/>
  </g>
</svg>
